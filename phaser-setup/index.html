<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>That-One-Knight-Game</title>
        <style>
            /*
                keep page styles simple and fullscreen:
                - game fills the browser window
                - no scroll bars
            */
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #1f1f1f;
                color: #ffffff;
                font-family: Arial, sans-serif;
            }

            #game-container {
                width: 100vw;
                height: 100vh;
            }

            #game-container canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <!-- phaser will insert the canvas into this div -->
        <div id="game-container"></div>

        <!-- phaser framework from cdn -->
        <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

        <!-- your game code -->
        <script src="main.js"></script>
    </body>
</html>
